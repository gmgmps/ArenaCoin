<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArenaCoin</title>

<ttps://telegram.org/js/telegram-web-app.jsscript>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Segoe UI;
    text-align:center;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:20px;
    max-width:400px;
    margin:auto;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid #00f0ff;
    object-fit:cover;
}

.name{
    font-size:22px;
    margin-top:10px;
    font-weight:bold;
}

.level{
    background:#ff7a00;
    display:inline-block;
    padding:8px 15px;
    border-radius:15px;
    margin-top:10px;
}

.energy-bg{
    height:15px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.energy-fill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#00f0ff,#00ff87);
}

.wheel{
    margin:30px auto;
    width:250px;
    height:250px;
    border-radius:50%;
    border:8px solid #334155;
    transition:4s ease-out;

    background:conic-gradient(
        #ff4757 0deg 60deg,
        #ffa502 60deg 120deg,
        #2ed573 120deg 180deg,
        #1e90ff 180deg 240deg,
        #a55eea 240deg 300deg,
        #ff6348 300deg 360deg
    );
}

button{
    background:#ff7a00;
    border:none;
    color:white;
    padding:15px 30px;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
}
</style>

</head>
<body>

<div class="card">

<img
id="userPhoto"
class="avatar"
src="https://ui-avatars.com/api/?name=Player"
alt="Avatar">

<div id="userName" class="name">
جاري التحميل...
</div>

<divtop:15px">
🪙 <span id="coins">0</span>
</div>

<div style="margin-top:10px">
⚡ <span id="energy">100</span>/100
</div>

<div class="energy-bg">
<div class="energy-fill"></div>
</div>

</div>

<div id="wheel" class="wheel"></div>

<button onclick="spinWheel()">
🎡 تدوير العجلة
</button>

<div id="result" style="margin-top:20px;font-size:22px">
</div>

<audio id="music" loop>
music.mp3
</audio>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

if(tg?.initDataUnsafe?.user){

    const user = tg.initDataUnsafe.user;

    document.getElementById("userName").innerText =
        user.first_name;

    if(user.photo_url){

        document.getElementById("userPhoto").src =
            user.photo_url;

    }else{

        document.getElementById("userPhoto").src =
            `https://ui-avatars.com/api/?name=${encodeURIComponent(user.first_name)}`;

    }

}else{

    document.getElementById("userName").innerText =
        "لاعب الحظ";

}

let coins = 0;

const rewards = [
"🪙 10 عملات",
"🪙 25 عملة",
"🪙 50 عملة",
"🪙 100 عملة",
"⚡ طاقة إضافية",
"⭐ ترقية مستوى"
];

function spinWheel(){

    let index =
        Math.floor(Math.random()*rewards.length);

    let rotation =
        3600 + (index * 60);

    document.getElementById("wheel").style.transform =
        `rotate(${rotation}deg)`;

    setTimeout(()=>{

        document.getElementById("result").innerText =
            "🎉 ربحت: " + rewards[index];

        if(index <= 3){

            let value =
                [10,25,50,100][index];

            coins += value;

            document.getElementById("coins").innerText =
                coins;

        }

    },4000);
}

document.body.addEventListener("click",()=>{

    const music =
        document.getElementById("music");

    music.volume = 0.3;

    music.play().catch(()=>{});

},{once:true});

</script>

</body>
</html>
