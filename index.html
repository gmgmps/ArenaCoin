<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>ArenaCoin</title>

    <!-- Telegram Mini Apps SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      :root {
        --bg: #0b1220;
        --surface: #172235;
        --surface-2: #1f2e46;
        --text: #f8fbff;
        --muted: #a8b6ca;
        --cyan: #35d8ff;
        --green: #48e29a;
        --orange: #ff9e3d;
        --danger: #ff656f;
        font-family: Tahoma, Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 50% -15%, #1e5270 0, transparent 38%),
          var(--bg);
      }
      .app {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .brand { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
      .brand span { color: var(--orange); }
      .demo-badge { display: none; border: 1px solid #53647b; color: var(--muted); border-radius: 99px; padding: 5px 10px; font-size: 12px; }
      .demo-badge.visible { display: block; }

      .card {
        padding: 17px;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(31,46,70,.97), rgba(19,30,47,.97));
        box-shadow: 0 14px 36px rgba(0,0,0,.23);
      }
      .profile { display: flex; align-items: center; gap: 13px; text-align: right; }
      .avatar { width: 62px; height: 62px; flex: 0 0 62px; border-radius: 50%; object-fit: cover; border: 2px solid var(--cyan); background: #273b58; }
      .name { overflow: hidden; font-size: 18px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .caption { margin-top: 5px; color: var(--muted); font-size: 13px; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
      .stat { padding: 13px; border-radius: 16px; background: rgba(0,0,0,.18); text-align: center; }
      .stat-label { color: var(--muted); font-size: 12px; }
      .stat-value { margin-top: 5px; font-size: 25px; font-weight: 800; direction: ltr; }
      #coins { color: var(--orange); }
      #energyText { color: var(--cyan); }
      .energy-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 1px 7px; font-size: 13px; }
      .energy-row small { color: var(--muted); }
      .energy-bar { height: 11px; overflow: hidden; border-radius: 99px; background: #0d1726; }
      .energy-fill { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--green)); transition: width .35s ease; }

      .game { padding-top: 27px; text-align: center; }
      .title { margin: 0; font-size: 22px; }
      .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
      .wheel-area { position: relative; width: min(75vw, 306px); height: min(75vw, 306px); margin: 27px auto 22px; }
      .pointer {
        position: absolute; z-index: 3; top: -4px; left: 50%; width: 0; height: 0;
        transform: translateX(-50%);
        border-right: 17px solid transparent; border-bottom: 0; border-left: 17px solid transparent; border-top: 32px solid #fff;
        filter: drop-shadow(0 3px 2px rgba(0,0,0,.38));
      }
      .wheel-wrap { width: 100%; height: 100%; padding: 8px; border-radius: 50%; background: linear-gradient(135deg, #4ae3ff, #f7a447); box-shadow: 0 0 0 6px #1d2c43, 0 16px 35px rgba(0,0,0,.34); }
      .wheel {
        position: relative; width: 100%; height: 100%; overflow: hidden; border: 5px solid #fff; border-radius: 50%;
        background: conic-gradient(
          #ff6868 0deg 45deg, #ffae48 45deg 90deg, #55df93 90deg 135deg, #55bfff 135deg 180deg,
          #b987ff 180deg 225deg, #ff7b58 225deg 270deg, #48d8d1 270deg 315deg, #f0d25d 315deg 360deg
        );
        transition: transform 4.4s cubic-bezier(.12,.78,.09,1);
      }
      .wheel::after { content: ""; position: absolute; inset: 42%; border-radius: 50%; background: #172235; border: 5px solid white; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
      .wheel-label {
        position: absolute; z-index: 1; top: 50%; left: 50%; width: 46%; color: #172235; font-size: clamp(11px, 3vw, 14px); font-weight: 800; text-shadow: 0 1px rgba(255,255,255,.3); transform-origin: 0 0;
      }
      .wheel-label:nth-child(1) { transform: rotate(22.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(2) { transform: rotate(67.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(3) { transform: rotate(112.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(4) { transform: rotate(157.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(5) { transform: rotate(202.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(6) { transform: rotate(247.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(7) { transform: rotate(292.5deg) translateX(34%) translateY(-50%); }
      .wheel-label:nth-child(8) { transform: rotate(337.5deg) translateX(34%) translateY(-50%); }
      .spin-button {
        min-width: 220px; padding: 15px 28px; border: 0; border-radius: 16px; color: #102033; background: linear-gradient(135deg, #ffbd59, #ff843e);
        box-shadow: 0 8px 0 #bb4e20, 0 12px 25px rgba(255,133,62,.25); cursor: pointer; font: inherit; font-size: 18px; font-weight: 800; transition: transform .15s, filter .15s;
      }
      .spin-button:active { transform: translateY(5px); box-shadow: 0 3px 0 #bb4e20; }
      .spin-button:disabled { cursor: not-allowed; filter: grayscale(.55); opacity: .7; }
      .result { min-height: 28px; margin: 20px 0 0; color: var(--green); font-weight: 800; }
      .hint { margin: 13px 0 0; color: var(--muted); font-size: 12px; }
      .notice { margin-top: 25px; padding: 12px 14px; border-radius: 14px; color: #c6d4e9; background: rgba(53,216,255,.08); border: 1px solid rgba(53,216,255,.17); font-size: 12px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">Arena<span>Coin</span></div>
        <div id="demoBadge" class="demo-badge">وضع التجربة</div>
      </header>

      <section class="card" aria-label="بيانات اللاعب">
        <div class="profile">
          <img id="userPhoto" class="avatar" alt="صورة اللاعب" />
          <div>
            <div id="userName" class="name">جاري التحميل...</div>
            <div class="caption">لاعب ArenaCoin</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-label">النقاط</div><div id="coins" class="stat-value">0</div></div>
          <div class="stat"><div class="stat-label">الطاقة</div><div><span id="energyText" class="stat-value">100</span><span class="caption"> / 100</span></div></div>
        </div>
        <div class="energy-row"><span>⚡ شريط الطاقة</span><small id="rechargeText">ممتلئة</small></div>
        <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
      </section>

      <section class="game" aria-label="عجلة الحظ">
        <h1 class="title">🎡 عجلة الحظ</h1>
        <p class="subtitle">كل دورة تكلّف 20 طاقة</p>
        <div class="wheel-area">
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel-wrap">
            <div id="wheel" class="wheel" aria-label="عجلة الجوائز">
              <span class="wheel-label">10</span><span class="wheel-label">25</span><span class="wheel-label">50</span><span class="wheel-label">100</span>
              <span class="wheel-label">20⚡</span><span class="wheel-label">30⚡</span><span class="wheel-label">75</span><span class="wheel-label">200</span>
            </div>
          </div>
        </div>
        <button id="spinButton" class="spin-button" type="button">أدر العجلة — 20 ⚡</button>
        <p id="result" class="result" aria-live="polite"></p>
        <p class="hint">تُشحن طاقة واحدة كل دقيقة.</p>
      </section>

      <p id="cloudStatus" class="notice">جاري تجهيز بيانات اللاعب...</p>
    </main>

    <script>
      (() => {
        "use strict";

        const MAX_ENERGY = 100;
        const SPIN_COST = 20;
        const RECHARGE_INTERVAL = 60 * 1000;
        const FIREBASE_TIMEOUT = 8000;

        // إعدادات مشروع Firebase الخاص بك.
        const firebaseConfig = {
          apiKey: "AIzaSyBNI0BrFz4LqPPALvtUAbNhZOC6GDc7hsE",
          authDomain: "arenacoin-f0cc8.firebaseapp.com",
          projectId: "arenacoin-f0cc8",
          storageBucket: "arenacoin-f0cc8.firebasestorage.app",
          messagingSenderId: "415637288138",
          appId: "1:415637288138:web:4acd633f6fedcdc8513033",
          measurementId: "G-BT6316JW2S"
        };
        const prizes = [
          { label: "+10 نقطة", type: "coins", value: 10 },
          { label: "+25 نقطة", type: "coins", value: 25 },
          { label: "+50 نقطة", type: "coins", value: 50 },
          { label: "+100 نقطة", type: "coins", value: 100 },
          { label: "+20 طاقة", type: "energy", value: 20 },
          { label: "+30 طاقة", type: "energy", value: 30 },
          { label: "+75 نقطة", type: "coins", value: 75 },
          { label: "+200 نقطة", type: "coins", value: 200 }
        ];

        const telegram = window.Telegram && window.Telegram.WebApp;
        if (telegram) {
          telegram.ready();
          telegram.expand();
        }

        const telegramUser = telegram && telegram.initDataUnsafe && telegram.initDataUnsafe.user;
        const user = telegramUser || { id: "demo-player", first_name: "لاعب تجريبي" };
        const playerId = String(user.id);
        const storageKey = `arenaCoin.player.${playerId}`;
        const initialState = { coins: 0, energy: MAX_ENERGY, energyUpdatedAt: Date.now() };
        let state = loadState();
        let spinning = false;
        let rotation = 0;
        let db = null;
        let firestore = null;
        let cloudAvailable = false;
        let dataReady = !telegramUser;
        let cloudSaveTimer = null;
        let cloudWriteInProgress = false;
        let cloudWritePending = false;

        const elements = {
          photo: document.getElementById("userPhoto"),
          name: document.getElementById("userName"),
          demoBadge: document.getElementById("demoBadge"),
          coins: document.getElementById("coins"),
          energy: document.getElementById("energyText"),
          energyFill: document.getElementById("energyFill"),
          recharge: document.getElementById("rechargeText"),
          wheel: document.getElementById("wheel"),
          button: document.getElementById("spinButton"),
          result: document.getElementById("result"),
          cloudStatus: document.getElementById("cloudStatus")
        };

        function loadState() {
          try {
            const saved = JSON.parse(localStorage.getItem(storageKey));
            if (!saved || typeof saved !== "object") return { ...initialState };
            return {
              coins: Number.isFinite(saved.coins) ? Math.max(0, saved.coins) : 0,
              energy: Number.isFinite(saved.energy) ? Math.min(MAX_ENERGY, Math.max(0, saved.energy)) : MAX_ENERGY,
              energyUpdatedAt: Number.isFinite(saved.energyUpdatedAt) ? saved.energyUpdatedAt : Date.now()
            };
          } catch {
            return { ...initialState };
          }
        }

        function saveState() {
          localStorage.setItem(storageKey, JSON.stringify(state));
        }

        function setCloudStatus(message) {
          elements.cloudStatus.textContent = message;
        }

        function rejectAfter(milliseconds, message) {
          return new Promise((_, reject) => {
            window.setTimeout(() => reject(new Error(message)), milliseconds);
          });
        }

        function refreshEnergy() {
          if (state.energy >= MAX_ENERGY) {
            state.energy = MAX_ENERGY;
            state.energyUpdatedAt = Date.now();
            return false;
          }
          const elapsed = Date.now() - state.energyUpdatedAt;
          const recovered = Math.floor(elapsed / RECHARGE_INTERVAL);
          if (recovered <= 0) return false;
          state.energy = Math.min(MAX_ENERGY, state.energy + recovered);
          state.energyUpdatedAt += recovered * RECHARGE_INTERVAL;
          return true;
        }

        function formatTime(milliseconds) {
          const seconds = Math.max(1, Math.ceil(milliseconds / 1000));
          return `طاقة جديدة خلال ${seconds} ث`;
        }

        function updateUI() {
          const energyRecovered = refreshEnergy();
          elements.coins.textContent = state.coins.toLocaleString("ar");
          elements.energy.textContent = state.energy.toLocaleString("ar");
          elements.energyFill.style.width = `${state.energy}%`;
          elements.button.disabled = !dataReady || spinning || state.energy < SPIN_COST;
          if (state.energy === MAX_ENERGY) {
            elements.recharge.textContent = "ممتلئة";
          } else {
            const nextEnergyIn = RECHARGE_INTERVAL - ((Date.now() - state.energyUpdatedAt) % RECHARGE_INTERVAL);
            elements.recharge.textContent = formatTime(nextEnergyIn);
          }
          saveState();
          if (energyRecovered) scheduleCloudSave();
        }

        function makeAvatar(name) {
          const initials = name.trim().split(/\s+/).slice(0, 2).map(word => word[0]).join("") || "A";
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="100%" height="100%" fill="#246b89"/><text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="70" fill="white">${initials}</text></svg>`;
          return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function setupProfile() {
          const name = [user.first_name, user.last_name].filter(Boolean).join(" ") || "لاعب ArenaCoin";
          elements.name.textContent = name;
          elements.photo.src = user.photo_url || makeAvatar(name);
          elements.demoBadge.classList.toggle("visible", !telegramUser);
        }

        function playerDocument() {
          return firestore.doc(db, "players", playerId);
        }

        function cloudPayload(includeCreatedAt = false) {
          const playerName = [user.first_name, user.last_name].filter(Boolean).join(" ") || "لاعب ArenaCoin";
          const payload = {
            telegramId: playerId,
            name: playerName,
            username: user.username || "",
            photoUrl: user.photo_url || "",
            coins: state.coins,
            energy: state.energy,
            energyUpdatedAt: state.energyUpdatedAt,
            updatedAt: firestore.serverTimestamp()
          };
          if (includeCreatedAt) payload.createdAt = firestore.serverTimestamp();
          return payload;
        }

        async function writeCloudState(includeCreatedAt = false) {
          if (!cloudAvailable || !dataReady) return;
          if (cloudWriteInProgress) {
            cloudWritePending = true;
            return;
          }
          cloudWriteInProgress = true;
          try {
            await firestore.setDoc(playerDocument(), cloudPayload(includeCreatedAt), { merge: true });
            setCloudStatus("✅ تم حفظ الاسم والنقاط والطاقة في Firebase.");
          } catch (error) {
            console.error("Firebase save error:", error);
            setCloudStatus("⚠️ تعذّر الحفظ في Firebase الآن، والبيانات محفوظة محليًا مؤقتًا.");
          } finally {
            cloudWriteInProgress = false;
            if (cloudWritePending) {
              cloudWritePending = false;
              writeCloudState();
            }
          }
        }

        function scheduleCloudSave() {
          if (!cloudAvailable || !dataReady) return;
          window.clearTimeout(cloudSaveTimer);
          cloudSaveTimer = window.setTimeout(() => writeCloudState(), 350);
        }

        function applyCloudState(data) {
          if (Number.isFinite(data.coins)) state.coins = Math.max(0, data.coins);
          if (Number.isFinite(data.energy)) state.energy = Math.min(MAX_ENERGY, Math.max(0, data.energy));
          if (Number.isFinite(data.energyUpdatedAt)) state.energyUpdatedAt = data.energyUpdatedAt;
        }

        async function connectFirebase() {
          if (!telegramUser) {
            setCloudStatus("وضع التجربة: افتح التطبيق من داخل تيليجرام ليحفظ بيانات اللاعب في Firebase.");
            dataReady = true;
            updateUI();
            return;
          }

          setCloudStatus("جاري تحميل بياناتك من Firebase...");
          try {
            const [firebaseApp, firebaseFirestore] = await Promise.race([
              Promise.all([
                import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"),
                import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js")
              ]),
              rejectAfter(FIREBASE_TIMEOUT, "Firebase SDK timed out")
            ]);
            const app = firebaseApp.initializeApp(firebaseConfig);
            db = firebaseFirestore.getFirestore(app);
            firestore = firebaseFirestore;
            cloudAvailable = true;

            const snapshot = await Promise.race([
              firestore.getDoc(playerDocument()),
              rejectAfter(FIREBASE_TIMEOUT, "Firestore read timed out")
            ]);
            if (snapshot.exists()) {
              applyCloudState(snapshot.data());
              setCloudStatus("✅ تم تحميل بياناتك من Firebase.");
            }

            dataReady = true;
            updateUI();

            if (!snapshot.exists()) {
              await writeCloudState(true);
            }
          } catch (error) {
            console.error("Firebase connection error:", error);
            cloudAvailable = false;
            dataReady = true;
            setCloudStatus("⚠️ تعذّر الاتصال بـFirebase. التطبيق يعمل محليًا الآن؛ تأكد أنك أنشأت Cloud Firestore وليس Realtime Database، ثم راجع Rules.");
            updateUI();
          }
        }

        function randomIndex(max) {
          if (window.crypto && window.crypto.getRandomValues) {
            const values = new Uint32Array(1);
            window.crypto.getRandomValues(values);
            return values[0] % max;
          }
          return Math.floor(Math.random() * max);
        }

        function showTelegramMessage(message) {
          if (telegram && telegram.showAlert) telegram.showAlert(message);
          else window.alert(message);
        }

        function spin() {
          refreshEnergy();
          if (spinning) return;
          if (!dataReady) return;
          if (state.energy < SPIN_COST) {
            updateUI();
            showTelegramMessage("⚡ تحتاج إلى 20 طاقة على الأقل لتدوير العجلة.");
            return;
          }

          spinning = true;
          state.energy -= SPIN_COST;
          state.energyUpdatedAt = Date.now();
          elements.result.textContent = "العجلة تدور...";
          updateUI();
          scheduleCloudSave();

          const index = randomIndex(prizes.length);
          const prize = prizes[index];
          const angle = 360 / prizes.length;
          const desiredRemainder = (360 - (index * angle + angle / 2)) % 360;
          const currentRemainder = ((rotation % 360) + 360) % 360;
          const adjustment = (desiredRemainder - currentRemainder + 360) % 360;
          rotation += 6 * 360 + adjustment;
          elements.wheel.style.transform = `rotate(${rotation}deg)`;

          window.setTimeout(() => {
            if (prize.type === "coins") state.coins += prize.value;
            if (prize.type === "energy") state.energy = Math.min(MAX_ENERGY, state.energy + prize.value);
            spinning = false;
            elements.result.textContent = `🎉 مبروك! ربحت ${prize.label}`;
            updateUI();
            scheduleCloudSave();
            if (telegram && telegram.HapticFeedback) telegram.HapticFeedback.notificationOccurred("success");
          }, 4400);
        }

        elements.button.addEventListener("click", spin);
        setupProfile();
        updateUI();
        connectFirebase();
        window.setInterval(updateUI, 1000);
      })();
    </script>
  </body>
</html>
